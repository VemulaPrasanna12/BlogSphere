{% extends 'base.html' %}
{% block title %}Delete post — My Blog{% endblock %}
{% block content %}
<main class="container my-5"><div class="row justify-content-center"><div class="col-md-6"><div class="form-card text-center">
  <h1 class="h2 text-danger">Delete post</h1><p>Are you sure you want to delete <strong>{{ post.title }}</strong>?</p>
  <form method="post">{% csrf_token %}<button type="submit" class="btn btn-danger">Yes, delete</button> <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancel</a></form>
</div></div></div></main>
{% endblock %}
