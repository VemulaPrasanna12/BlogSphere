{% extends 'base.html' %}
{% block title %}Admin Login — My Blog{% endblock %}
{% block content %}
<main class="container my-5"><div class="row justify-content-center"><div class="col-md-5 col-lg-4"><div class="form-card">
  <h1 class="h3 text-center mb-4">Admin Login</h1>
  <form method="post">{% csrf_token %}{{ form.non_field_errors }}
    <div class="mb-3"><label class="form-label" for="id_username">Username</label>{{ form.username }}{{ form.username.errors }}</div>
    <div class="mb-4"><label class="form-label" for="id_password">Password</label>{{ form.password }}{{ form.password.errors }}</div>
    <button class="btn btn-primary w-100" type="submit">Login</button>
  </form>
</div></div></div></main>
{% endblock %}
